name: Research - strict stop-loss (4% from entry)

# One-off research: the live Dip plan with a strict fixed stop (3%-8% below entry) versus the 3 ATR stop,
# with gap-through-the-stop fills, daily marked-to-market account drawdowns and crash windows.
# Read-only: never places or touches orders. Runs only when you start it.

on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Limit the number of stocks for a quick trial run, e.g. 40 (0 = all, the real test)'
        default: '0'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the research
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FEED: 'sip'
          ALPACA_RPM: '190'
          SR_MAX_SYMBOLS: ${{ inputs.max_symbols }}
          SR_OUT: research-out-stop
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: node scanner/stopresearch.js

      - name: Save the results as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-results
          path: research-out-stop/
          if-no-files-found: warn

name: Research - bottom and rebound rule

# One-off research: does "selling dries up on a down day, strong finish, close back above the 20-day
# average" pick out bottoms and rebounds? Three readings of the rule are tested on S&P 500 stocks (and
# on SPY), per period, against the average stock on the same day and against the live Uptrend Dip.
# Downloads daily bars from mid-2015 with your Alpaca keys. Read-only: it never places or touches
# orders. Runs only when you start it.

on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Limit the number of stocks for a quick trial run, e.g. 40 (0 = all, the real test)'
        default: '0'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the research
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FEED: 'sip'
          ALPACA_RPM: '190'
          RB_MAX_SYMBOLS: ${{ inputs.max_symbols }}
          RB_OUT: research-out-rebound
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: node scanner/reboundresearch.js

      - name: Save the results as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebound-results
          path: research-out-rebound/
          if-no-files-found: warn

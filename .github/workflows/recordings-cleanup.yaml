name: Clean old recordings

# Recordings and Shorts saved from the Studio live on the "recordings" branch (rec/<UTC date>-<time>_<name>/).
# Every night anything from 2 or more days ago is deleted, and the branch history is rewritten so the space is really freed.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recordings
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the recordings branch
        uses: actions/checkout@v6
        with:
          ref: recordings
          fetch-depth: 1

      - name: Delete recordings older than 2 days and squash history
        run: |
          set -e
          mkdir -p rec
          cutoff=$(date -u -d '2 days ago' +%Y%m%d)
          for d in rec/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d"); day=${n:0:8}
            if [[ "$day" =~ ^[0-9]{8}$ ]] && [ "$day" -le "$cutoff" ]; then echo "deleting $n"; rm -rf "$d"; fi
          done
          touch rec/.keep
          git config user.name "studio-bot"; git config user.email "studio-bot@users.noreply.github.com"
          git checkout -q --orphan fresh
          git add -A
          git commit -q -m "Recordings kept for 2 days $(date -u +%FT%TZ)"
          git push -q -f origin fresh:recordings
          du -sh rec | tail -1

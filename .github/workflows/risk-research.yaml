name: Research - risk limits (cut crash drawdowns)

# One-off research: the live Dip plan plus portfolio risk rules (entry caps per day, position caps, smaller size,
# pause when the S&P 500 is stressed, account circuit breaker). Read-only: never places or touches orders.
# Runs only when you start it.

on:
  push:
    paths: ['research-trigger/risk.txt']     # Claude starts the run by pushing this file
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Limit the number of stocks for a quick trial run, e.g. 40 (0 = all, the real test)'
        default: '0'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Today's date (price cache key)
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Pick the experiment set (first line of research-trigger/risk.txt)
        id: set
        run: |
          s=base; [ -f research-trigger/risk.txt ] && s=$(head -1 research-trigger/risk.txt | tr -cd 'a-z0-9'); case "$s" in base|batch1|batch3) ;; *) s=base;; esac
          echo "s=$s" >> "$GITHUB_OUTPUT"

      - name: Restore cached price data (same calendar day)
        uses: actions/cache@v4
        with:
          path: price-cache
          key: bars-${{ steps.day.outputs.d }}

      - name: Run the research
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FEED: 'sip'
          ALPACA_RPM: '190'
          RR_MAX_SYMBOLS: ${{ inputs.max_symbols }}
          RR_OUT: research-out-risk
          RR_SET: ${{ steps.set.outputs.s }}
          RR_CACHE: price-cache
          RR_DD_CUT: ${{ steps.set.outputs.s == 'base' && '0.25' || steps.set.outputs.s == 'batch3' && '0' || '0.40' }}
          RR_BASE: ${{ steps.set.outputs.s == 'batch3' && 's6' || '' }}
          RR_KEEP_MIN: ${{ steps.set.outputs.s == 'batch3' && '0.90' || '0.70' }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: node scanner/riskresearch.js

      - name: Save the results as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-results
          path: research-out-risk/
          if-no-files-found: warn

      - name: Save the summary into the repository (research-results branch)
        if: always()
        run: |
          set -e
          mkdir -p /tmp/rr && cp research-out-risk/* /tmp/rr/ 2>/dev/null || true
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git fetch origin research-results:research-results 2>/dev/null || true
          if git show-ref -q refs/heads/research-results; then git checkout -q research-results
          else git checkout -q --orphan research-results; git rm -rfq . ; fi
          rm -rf risk/${{ steps.set.outputs.s }}
          mkdir -p risk/${{ steps.set.outputs.s }} && cp /tmp/rr/* risk/${{ steps.set.outputs.s }}/
          git add risk && git commit -q -m "Risk research results $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          for i in 1 2 3 4; do git push -q origin research-results && break || { git pull -q --rebase origin research-results || true; sleep 5; }; done

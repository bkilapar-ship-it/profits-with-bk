name: Research - entry price (fair value gaps / order blocks)

# One-off research: do unmitigated fair value gaps and order blocks just below an Uptrend Dip signal
# predict a worse trade, and would a limit order at that zone beat buying at the next open?
# Downloads daily bars from mid-2015 with your Alpaca keys. Read-only: it never places or touches orders.
# Runs only when you start it.

on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Limit the number of stocks for a quick trial run, e.g. 40 (0 = all, the real test)'
        default: '0'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the research
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FEED: 'sip'
          ALPACA_RPM: '190'
          ER_MAX_SYMBOLS: ${{ inputs.max_symbols }}
          ER_OUT: research-out-entry
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: node scanner/entryresearch.js

      - name: Save the results as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-results
          path: research-out-entry/
          if-no-files-found: warn

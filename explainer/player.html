<!doctype html>
<html><head><meta charset="utf-8"><title>Explainer player</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#0d1b2a;overflow:hidden}svg{display:block;width:1920px;height:1080px;font-family:var(--ex-font)}</style>
</head><body>
<svg id="v" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"></svg>
<script src="engine.js"></script>
<script>
/* Used by render.js to make the video: player.html?ep=episodes/inflation.json&lang=te */
(async () => {
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'en';
  const [ep, channel] = await Promise.all([fetch(q.get('ep')).then(r => r.json()), fetch('channel.json').then(r => r.json()).catch(() => ({}))]);
  const sample = JSON.stringify(ep) + JSON.stringify(channel) + '0123456789£₹$€';
  await Promise.all(['400', '700', '800'].map(w => document.fonts.load(`${w} 40px ${getComputedStyle(document.documentElement).getPropertyValue('--ex-font')}`, sample).catch(() => {})));
  await document.fonts.ready;
  const app = Explainer.mount(document.getElementById('v'), ep, lang, { channel });
  window.DUR = app.duration; window.render = app.render; window.CUES = app.timeline.cues;
  // recordings: which scenes have voice, and where it starts (render.js mixes the sound in)
  window.TAKES = app.timeline.scenes.filter(o => o.take).map(o => ({ i: o.i, at: o.start + Explainer.LEAD, take: o.take }));
  // what the "Make video" page needs to add your voice and camera on top of the finished animation
  window.TIMELINE = { episode: ep.id, lang, duration: app.duration, lead: Explainer.LEAD, fade: Explainer.FADE, sig: Explainer.takeSig(ep, lang), last: app.timeline.scenes.length ? app.timeline.scenes[app.timeline.scenes.length - 1].i : -1,
    takes: app.timeline.scenes.filter(o => o.take).map(o => { const T = Explainer.SCENES[o.scene.type];
      return { scene: o.i, file: o.take.file, kind: o.take.kind, in: o.take.in, out: o.take.out, start: o.start, end: o.end, at: o.start + Explainer.LEAD, first: o === app.timeline.scenes[0],
        slot: T.camera && o.take.kind === 'video' ? T.slot(Explainer.sceneData(o.scene)) : null }; }) };
  // draws time t and waits until any camera frames on screen have loaded
  const svg = document.getElementById('v');
  window.renderAsync = async t => {
    app.render(t);
    for (let k = 0; k < 400 && svg.querySelector('image[data-pending]'); k++) await new Promise(r => setTimeout(r, 5));
  };
  window.SRT = Explainer.srt(ep, lang); window.SCRIPT = Explainer.script(ep, lang);
  window.READY = true;
})().catch(e => { window.ERROR = String(e && e.stack || e); });
</script>
</body></html>
